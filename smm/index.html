<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO-Фабрика — Проекты</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <a class="logo" href="index.html">⚙️ SEO-Фабрика</a>
      <nav class="nav">
        <a href="index.html" class="active">Проекты</a>
        <a href="settings.html">Настройки</a>
      </nav>
    </div>
  </div>

  <main class="main">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;">
      <div>
        <div class="page-title">Проекты</div>
        <div class="page-sub">Массовая генерация SEO-страниц через ИИ</div>
      </div>
      <button class="btn btn-primary" id="newProjectBtn">＋ Новый проект</button>
    </div>

    <!-- Create project modal -->
    <div id="createModal" style="display:none;">
      <div class="modal-overlay" onclick="closeCreateModal(event)">
        <div class="modal" style="max-width:480px;" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h3>Новый проект</h3>
            <button class="modal-close" onclick="closeCreateModal()">✕</button>
          </div>
          <div style="padding:22px;">
            <div class="form-row">
              <label>Название проекта *</label>
              <input type="text" id="cpName" placeholder="Таро — 78 карт">
            </div>
            <div class="form-row">
              <label>Домен (для sitemap)</label>
              <input type="text" id="cpDomain" placeholder="neotaro.ru">
            </div>
            <div class="form-row">
              <label>Описание (необязательно)</label>
              <input type="text" id="cpDesc" placeholder="Страницы карт Таро">
            </div>
            <div id="cpError" style="color:var(--bad);font-size:13px;margin-bottom:10px;display:none;"></div>
            <button class="btn btn-primary" style="width:100%;" id="cpSubmit">Создать проект</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Projects grid -->
    <div id="projectsContainer">
      <div class="card" style="text-align:center;padding:40px;color:var(--muted);">
        <span class="spinner"></span> Загрузка проектов…
      </div>
    </div>
  </main>

  <script src="app.js?v=3"></script>
  <script>
    const container = document.getElementById('projectsContainer');

    async function loadProjects() {
      try {
        const projects = await api.listProjects();
        renderProjects(projects);
      } catch (e) {
        container.innerHTML = `<div class="alert alert-bad">❌ Ошибка загрузки: ${e.message}. Убедитесь, что бэкенд запущен.</div>`;
      }
    }

    function renderProjects(projects) {
      if (!projects.length) {
        container.innerHTML = `
          <div class="card empty">
            <div class="empty-icon">📁</div>
            <p>Проектов пока нет. Создайте первый!</p>
            <button class="btn btn-primary" onclick="openCreateModal()">＋ Новый проект</button>
          </div>`;
        return;
      }
      const cards = projects.map(p => `
        <a class="card proj-card" href="project.html?id=${p.id}">
          <div class="proj-name">${escHtml(p.name)}</div>
          ${p.domain ? `<div class="proj-domain">🌐 ${escHtml(p.domain)}</div>` : ''}
          ${p.description ? `<div style="color:var(--muted);font-size:13px;">${escHtml(p.description)}</div>` : ''}
          <div class="proj-meta">
            <span class="badge ${p.status}">${statusLabel(p.status)}</span>
            <span>📄 ${p.pages_count ?? 0} страниц</span>
            <span>🔑 ${p.keys_count ?? 0} ключей</span>
          </div>
          <div style="color:var(--muted);font-size:12px;margin-top:4px;">${fmtDate(p.created_at)}</div>
        </a>`).join('');
      container.innerHTML = `<div class="card-grid">${cards}</div>`;
    }

    function openCreateModal() {
      document.getElementById('createModal').style.display = 'block';
      setTimeout(() => document.getElementById('cpName').focus(), 50);
    }
    function closeCreateModal(e) {
      if (e && e.target !== document.querySelector('#createModal .modal-overlay')) return;
      document.getElementById('createModal').style.display = 'none';
      ['cpName','cpDomain','cpDesc'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('cpError').style.display = 'none';
    }
    document.getElementById('newProjectBtn').onclick = openCreateModal;

    document.getElementById('cpSubmit').onclick = async () => {
      const name   = document.getElementById('cpName').value.trim();
      const domain = document.getElementById('cpDomain').value.trim();
      const desc   = document.getElementById('cpDesc').value.trim();
      const errEl  = document.getElementById('cpError');
      if (!name) { errEl.textContent = 'Название обязательно'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      const btn = document.getElementById('cpSubmit');
      btn.disabled = true; btn.textContent = 'Создание…';
      try {
        const p = await api.createProject({ name, domain, description: desc });
        closeCreateModal();
        window.location.href = `project.html?id=${p.id}`;
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Создать проект';
      }
    };
    document.getElementById('cpName').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('cpSubmit').click(); });

    loadProjects();
    setInterval(loadProjects, 5000);
  </script>
</body>
</html>
