name: bundle-smm

on:
  push:
    paths:
      - 'smm/**'            # Триггерится только при изменениях внутри smm
      - '!smm/BUNDLE.txt'   # Игнорирует сам бандл
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect smm frontend files
        run: |
          TARGET_DIR="smm"
          OUT="${TARGET_DIR}/BUNDLE.txt"

          rm -f "$OUT"
          {
            echo "# SMM Frontend — снимок репозитория"
            echo "# commit: ${GITHUB_SHA}"
            echo "# built:  $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "## Состав файлов"
          } > "$OUT"

          # Ищем файлы только в папке smm, исключая скомпилированный _next и медиа
          FILES=$(find "$TARGET_DIR" -type f \
            ! -path '*/.git/*' \
            ! -path '*/_next/*' \
            ! -name 'BUNDLE.txt' \
            ! -name '.DS_Store' \
            ! -name '*.map' \
            ! -name '*.png' \
            ! -name '*.jpg' \
            ! -name '*.jpeg' \
            ! -name '*.webp' \
            ! -name '*.ico' \
            ! -name '*.svg' \
            ! -name '*.zip' \
            | sort)

          # Записываем оглавление
          for f in $FILES; do
            printf '%s  (%s строк)\n' "$f" "$(wc -l < "$f")" >> "$OUT"
          done

          # Записываем содержимое файлов
          for f in $FILES; do
            {
              echo
              echo "════════════════════════════════════════════════════════"
              echo "  $f"
              echo "════════════════════════════════════════════════════════"
              echo
              cat "$f"
            } >> "$OUT"
          done

          echo "Готово: $(wc -l < "$OUT") строк в бандле"

      - name: Commit and Push
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add smm/BUNDLE.txt
          git diff --staged --quiet || git commit -m "bundle: обновление снимка smm [skip ci]"
          git push
